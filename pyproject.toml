[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-entrepreneurship-construct-specification"
version = "0.1.0"
description = "Platform for diagnosing how artificial intelligence is specified as a construct in entrepreneurship research."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "artificial-intelligence",
  "entrepreneurship",
  "bibliometrics",
  "knowledge-graph",
  "theory-elaboration",
  "construct-specification",
]
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "fastapi>=0.100",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
graph = [
  "neo4j>=5.0",
]
nlp = [
  "bertopic>=0.16",
  "keybert>=0.8",
  "yake>=0.4",
  "gensim>=4.3",
  "plotly>=5.0",
]
viz = [
  "uvicorn>=0.23",
]
providers = [
  "google-genai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
