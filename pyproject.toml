[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etv-v2"
version = "0.1.0"
description = "Theory-elaboration evidence platform for diagnosing AI construct specification in entrepreneurship research."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "artificial-intelligence",
  "entrepreneurship",
  "bibliometrics",
  "knowledge-graph",
  "theory-elaboration",
  "construct-specification",
]
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.0",
  "fastapi>=0.100",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
graph = [
  "neo4j>=5.0",
]
nlp = [
  "bertopic>=0.16",
  "keybert>=0.8",
]
viz = [
  "uvicorn>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
