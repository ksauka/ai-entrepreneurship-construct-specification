# Neo4j for the ETV_V2 knowledge graph (Stage 2B).
# Start:  docker compose up -d
# Browser: http://localhost:7474  (bolt://localhost:7687)
# Credentials come from .env (NEO4J_USER / NEO4J_PASSWORD); see .env.example.
services:
  neo4j:
    image: neo4j:5.24-community
    container_name: etv_v2_neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-etv_v2_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-etv_v2_password}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
