  entrepreneurship_generalist_screen:
    display_name: Entrepreneurship papers in generalist journals
    short_name: Generalist-journal entrepreneurship papers
    population_type: article_level_screened_population
    source: former_query_3_generalist_outlet_frame
    status: screen_registered_not_yet_executed
    entrepreneurship_only_label_permitted: true_after_completed_screen
    article_level_entrepreneurship_screen_required: true
    candidate_frame:
      description: >
        The nine generalist management and innovation outlets in the former
        Query 3 journal frame after removal of the five represented AJG
        leading-entrepreneurship journals.
      papers_before_article_screen: 564
      source_titles: 9
      outlets:
        - Management Science
        - Research Policy
        - Strategic Management Journal
        - Journal of Management Studies
        - Organization Science
        - Journal of Management
        - Academy of Management Review
        - Academy of Management Journal
        - Administrative Science Quarterly
    exclusion_rule: >
      Exclude papers already assigned to either AJG ENT-SBM journal population;
      journal membership alone cannot qualify a generalist-journal paper.
    screening_rule: >
      Retain a paper only when its title, abstract, or author keywords make
      entrepreneurship, entrepreneurs, founders, new ventures, start-ups, or
      an entrepreneurial process a substantive study object rather than an
      incidental example. Automated retrieval may identify candidates, but a
      reviewed article-level decision and inclusion reason are required.
    required_screen_fields:
      - paper_id
      - source_title
      - entrepreneurship_relevant
      - admissible_evidence
      - inclusion_or_exclusion_reason
      - reviewer_id
      - reviewed_at
    count_policy: >
      Do not publish a paper count or expose this dataset scope until the
      article-level screen and its audit are complete.

derived_dataset_scopes:
  - id: ajg_leading_entrepreneurship
    display_name: Leading entrepreneurship journals (AJG 2024)
    operation: exact_membership
    inputs:
      - leading_entrepreneurship_ajg
    interpretation: Journal-defined leading entrepreneurship population.

  - id: ajg_broader_entrepreneurship
    display_name: Broader entrepreneurship journals (AJG 2024)
    operation: exact_membership
    inputs:
      - broader_entrepreneurship_ajg
    interpretation: Remaining AJG ENT-SBM journals graded 1 or 2.

  - id: ajg_all_entrepreneurship
    display_name: All AJG entrepreneurship journals
    operation: union
    inputs:
      - leading_entrepreneurship_ajg
      - broader_entrepreneurship_ajg
    interpretation: All 36 AJG 2024 ENT-SBM journals.

  - id: gsm_entrepreneurship_innovation
    display_name: Leading entrepreneurship and innovation outlets (Google Scholar Metrics 2025)
    operation: exact_membership
    inputs:
      - entrepreneurship_innovation_gsm
    interpretation: Combined-field outlet population; not entrepreneurship-only.

  - id: generalist_entrepreneurship_screened
    display_name: Entrepreneurship papers in generalist journals
    operation: reviewed_article_level_membership
    inputs:
      - entrepreneurship_generalist_screen
    availability: pending_completed_screen
    interpretation: >
      Entrepreneurship-relevant papers retained after article-level review;
      the 564-paper candidate frame is not itself an entrepreneurship dataset.

  - id: external_lists_overlap
    display_name: AJG-Google Scholar overlap
    operation: intersection
    inputs:
      - leading_entrepreneurship_ajg
      - entrepreneurship_innovation_gsm
    interpretation: Journals appearing in both external lists.

  - id: external_lists_union
    display_name: Entrepreneurship and innovation outlet union
    operation: union
    inputs:
      - leading_entrepreneurship_ajg
      - entrepreneurship_innovation_gsm
    interpretation: >
      Broad journal-defined outlet population. Papers in this union require a
      separate article-level relevance screen before being described as an
      entrepreneurship-paper population.

