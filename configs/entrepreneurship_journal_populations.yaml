known_title_audit:
  - issue: ETP appears under two Scopus source-title labels.
    resolution: Merge both labels into Entrepreneurship Theory and Practice.
  - issue: >
      The earlier Query 4 used the American spelling "Behavior" while the
      retained Scopus source title uses "Behaviour".
    affected_current_corpus_papers: 28
    resolution: >
      Match both spellings through the reviewed alias registry; do not rely on
      a single EXACTSRCTITLE spelling for derived dataset construction.

construction_rules:
  - Preserve the source title as supplied by Scopus in paper-level outputs.
  - Match only a canonical title or an explicitly listed alias after lowercasing and collapsing whitespace.
  - Do not use fuzzy matching.
  - Keep both source-list memberships when a journal appears in both lists.
  - Do not use h5-index or AJG grade as a paper-level quality score.
  - Do not describe the Google Scholar Metrics population or the union as entrepreneurship-only.
  - Require a separately documented article-level screen before making entrepreneurship-specific claims from the Google Scholar Metrics population or the union.
  - Record source-list version, matching rule, paper count, represented journals, aliases applied, and unmatched journals in every generated manifest.

required_outputs:
  paper_membership: data/processed/analysis/theory_elaboration/journal_populations/entrepreneurship_journal_population_membership.csv
  source_audit: data/processed/analysis/theory_elaboration/journal_populations/entrepreneurship_journal_population_source_audit.csv
  manifest: data/processed/analysis/theory_elaboration/journal_populations/entrepreneurship_journal_population_manifest.json
