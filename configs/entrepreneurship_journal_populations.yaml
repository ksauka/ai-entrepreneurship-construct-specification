registry:
  id: entrepreneurship-journal-populations-v1
  title: External journal lists for entrepreneurship and innovation populations
  status: proposed_for_dataset_construction
  created_on: "2026-08-13"
  classification_unit: source_journal
  assignment_mode: multilabel
  primary_dataset: data/processed/analysis/primary_analysis_dataset.csv
  source_title_column: Source title
  stable_matching_rule: reviewed_exact_title_or_alias
  fuzzy_matching_permitted: false
  purpose: >
    Define externally sourced, reproducible journal populations without
    treating a citation ranking as a disciplinary classification. The AJG
    populations distinguish leading AJG entrepreneurship journals, the
    remaining AJG entrepreneurship journals, citation-visible
    entrepreneurship-and-innovation outlets, and article-level
    entrepreneurship papers published in generalist outlets. Journal-list
    membership and article-level relevance are never treated as equivalent.

sources:
  ajg_2024:
    organisation: Chartered Association of Business Schools
    product: Academic Journal Guide 2024
    field_code: ENT-SBM
    field_name: Entrepreneurship and Small Business Management
    selection_rule: >
      Use grades 3, 4, and 4-star for the leading population; use the remaining
      grade 1 and 2 ENT-SBM journals for the broader population.
    field_inventory:
      grade_4_star: 2
      grade_4: 1
      grade_3: 6
      grade_2: 10
      grade_1: 17
      total: 36
    methodology_url: https://assets.charteredabs.org/ajg-2024-methodology.pdf
    accessible_listing_url: https://www.scmor.com/view/10554
    interpretation: >
      This is the field-classification basis for the journal-defined leading
      entrepreneurship population. AJG grade is used only to apply the
      prespecified leading-journal threshold, not as an article-quality score.

  google_scholar_metrics_2025:
    organisation: Google Scholar
    product: Scholar Metrics
    category: Entrepreneurship and Innovation
    ranking_rule: Top 20 publications ordered by five-year h-index and h-median.
    publication_window: "2020-2024"
    citations_indexed: "July 2025"
    source_url: https://scholar.google.com/citations?view_op=top_venues
    methodology_url: https://scholar.google.com/intl/en/scholar/metrics.html
    list_supplied_on: "2026-08-13"
    interpretation: >
      This is a recent citation-visibility ranking for a combined
      entrepreneurship-and-innovation category. It does not classify every
      listed source as an entrepreneurship journal and must not be labelled as
      an entrepreneurship-only population.
    metric_note: >
      h5_index is the largest h for which h articles published in the five
      complete calendar years received at least h citations each. h5_median is
      the median citation count of the articles in that h5 core.

