current_corpus_domain_construction:
  status: complete
  construction_rule: >
    Use the preserved journal-domain registries as filters over source titles
    represented in the existing corpus. No new papers are searched for or
    added to populate a domain.
  aliases: configs/business_domain_journal_aliases.csv
  assignments: data/processed/analysis/theory_elaboration/domains/business_domain_assignments.csv
  represented_sources: data/processed/analysis/theory_elaboration/domains/business_domain_source_titles.csv
  manifest: data/processed/analysis/theory_elaboration/domains/business_domain_manifest.json
  registered_domain_count: 10
  combined_with_query_defined_domains: 13

registered_query_domain_construction:
  status: approved_by_user_2026-07-20
  reason: >
    FT50 remains a distinct analytical domain defined by registered Query 2.
    The historical registry combines entrepreneurship and innovation, so the
    design separately defines core entrepreneurship through Query 3 and other
    entrepreneurship through Query 4, while retaining innovation as an
    ASJC-derived domain.
  domains:
    ft50:
      display_name: FT50
      basis: in_query_2
      source_scope_label: FT50 journals
      current_corpus_papers: 438
      current_corpus_source_titles: 37
    core_entrepreneurship:
      display_name: Core entrepreneurship
      basis: in_query_3
      source_scope_label: Leading entrepreneurship journals
      current_corpus_papers: 646
      current_corpus_source_titles: 15
    other_entrepreneurship:
      display_name: Additional entrepreneurship
      basis: in_query_4
      source_scope_label: Additional entrepreneurship journals
      current_corpus_papers: 986
      current_corpus_source_titles: 13
  pairwise_overlap_papers:
    ft50_and_core_entrepreneurship: 212
    ft50_and_other_entrepreneurship: 0
    core_and_other_entrepreneurship: 0
  assignment_level: paper
  interpretation: >
    These are corpus-specific domains defined by the registered search design.
    They are not official ASJC categories. FT50 can overlap another domain;
    Core and Additional entrepreneurship are disjoint registered populations.
  prohibited_basis:
    - automatic topic label
    - model-assigned AI specification code
    - undocumented keyword rule
  outputs:
    paper_assignments: data/processed/analysis/theory_elaboration/domains/registered_query_domain_assignments.csv
    source_title_summary: data/processed/analysis/theory_elaboration/domains/registered_query_domain_source_titles.csv
    manifest: data/processed/analysis/theory_elaboration/domains/registered_query_domain_manifest.json

normalization:
  legacy_rule: lowercase_and_collapse_whitespace
  punctuation_stripping: false
  journal_aliases_required: true
  alias_examples_requiring_audit:
    - legacy_title: Journal of Innovation & Knowledge
      current_title: Journal of Innovation and Knowledge
    - legacy_title: Technology Analysis & Strategic Management
      current_title: Technology Analysis and Strategic Management
  rule: >
    Preserve exact Scopus source titles in outputs. Resolve title variants
    through an explicit, reviewed alias table; do not use fuzzy matching or
    silently strip punctuation.

assignment_rules:
  - A journal may belong to more than one field, exactly as in the legacy registry.
  - A paper inherits every registered field of its source journal.
  - No arbitrary primary field is used in the horizontal contrast.
  - Multi-label incidence uses unique papers as its denominator, so field percentages may sum above 100 percent.
  - Query membership is reported separately except for the explicitly registered Query 2 FT50, Query 3 Core entrepreneurship and Query 4 Additional entrepreneurship domains.
  - FT50 is a separate analytical domain and may overlap Core entrepreneurship.
  - Unmapped titles remain Unclassified until a reviewed crosswalk revision is approved.
  - Every alias, addition, deletion, and split decision retains its reviewer, rationale, date, and taxonomy version.

