official_scopus_asjc:
  publisher: Elsevier
  product: Scopus
  release: June 2026
  path: data/external/scopus/ext_list_Jun_2026.xlsx
  checksum_sha256: bf759453843e09b691c75ef2ba9b8a661bead678276134d248c47d56be991b9d
  download_url: https://downloads.ctfassets.net/o78em1y1w4i4/7xtaTxNiNcWRTeZkV86eNy/710bfd3c7f7c7c9c88eeb3638ba4be43/ext_list_Jun_2026.xlsx
  classification_unit: Scopus source
  identifier_match: ISSN_or_EISSN
  assignment_mode: multilabel
  reviewed_overrides:
    path: configs/scopus_asjc_reviewed_overrides.csv
    checksum_sha256: cf1470e42ad375f024c3cc90d76b0c5feca70fe011c5261daedcad2fcc176055
    rule: >
      A unique title-only or ISSN-only candidate is never accepted
      automatically. Every non-exact source pair must identify one official
      Scopus source record in this reviewed table. Raw workbook ASJC values
      remain in the crosswalk when a reviewed correction is needed.
  inheritance_rule: >
    Each paper inherits every ASJC code assigned to its matched Scopus source
    in the official June 2026 source list, except for one documented source-row
    metadata anomaly whose raw and reviewed classifications are both retained.
  matching_priority:
    - exact_normalized_source_title_and_issn
    - reviewed_non_exact_source_override
    - review_required_for_title_only_or_issn_only_suggestion
    - unresolved
  outputs:
    source_crosswalk: data/processed/analysis/theory_elaboration/asjc/scopus_asjc_source_crosswalk.csv
    paper_assignments: data/processed/analysis/theory_elaboration/asjc/paper_asjc_assignments.csv
    paper_assignments_long: data/processed/analysis/theory_elaboration/asjc/paper_asjc_assignments_long.csv
    manifest: data/processed/analysis/theory_elaboration/asjc/asjc_assignment_manifest.json
  temporal_limitation: >
    These are the official source classifications in the June 2026 release.
    They are not historical ASJC assignments reconstructed separately for
    every publication year.

purpose:
  platform_filtering: Preserve the journal-domain filters used by the earlier methodological platform.
  horizontal_contrasting: Compare the same AI specification dimensions across the registered journal domains.
  non_purpose:
    - Treating Query 1 as a business domain.
    - Treating query membership other than the explicitly registered Query 2, Query 3 and Query 4 domains as a business domain.
    - Assigning domains from automatic topic labels.
    - Reclassifying papers from their abstract when the registered filter is explicitly journal based.

