# Optional overlay for a deployment that supports a genuine reader role.
# Review Neo4j licensing before setting NEO4J_ACCEPT_LICENSE_AGREEMENT.
services:
  neo4j:
    image: neo4j:5.24-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "${NEO4J_ACCEPT_LICENSE_AGREEMENT:?Review Neo4j licensing and set NEO4J_ACCEPT_LICENSE_AGREEMENT explicitly}"
